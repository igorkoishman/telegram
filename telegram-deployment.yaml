apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      containers:
      - name: telegram-bot
        image: igorkoishman/telegram-translator:local-encoding-fix
        imagePullPolicy: Never
        env:
        - name: TELEGRAM_BOT_TOKEN
          value: "8170886776:AAFIPACI3c8zyQ442fMkuFBXSisIAXoI1xU"
        - name: TELEGRAM_MODE
          value: "polling"
        - name: TELEGRAM_WEBHOOK_SECRET
          value: "tg-secret-9f3c1d-2025"
        - name: JAVA_OPTS
          value: "-Xmx4g -Xms1g"
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: TRANSLATION_MODELS_AUTO_DOWNLOAD
          value: "true"
        - name: TRANSLATION_MODELS_WHISPER_MODELS
          value: "tiny,small"
        - name: TRANSLATION_MODELS_WHISPER_BACKENDS
          value: "faster-whisper,openai-whisper"
        - name: TRANSLATION_MODELS_TRANSLATION_MODELS
          value: "m2m100,nllb"
        - name: LANG
          value: "en_US.UTF-8"
        - name: LC_ALL
          value: "en_US.UTF-8"
        volumeMounts:
        - name: telegram-data
          mountPath: /app/models
          subPath: models
        - name: telegram-data
          mountPath: /app/uploads
          subPath: uploads
        - name: telegram-data
          mountPath: /app/outputs
          subPath: outputs
        - name: telegram-data
          mountPath: /app/downloads
          subPath: downloads
      volumes:
      - name: telegram-data
        persistentVolumeClaim:
          claimName: telegram-data-pvc
